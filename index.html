<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QI+1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#060b1f;
    --bg-mid:#0e1a44;
    --card-bg:#0b1638;
    --card-border:rgba(159,216,255,0.14);
    --star-light:#9fd8ff;
    --white:#f5f8ff;
    --muted:#7c8db5;
    --gold:#f2c572;
    --error:#e08a8a;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(159,216,255,0.08), transparent 55%),
      radial-gradient(ellipse at 100% 110%, rgba(242,197,114,0.05), transparent 45%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    color:var(--white);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }

  #stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  #stars span{
    position:absolute;
    width:2px;
    height:2px;
    background:var(--star-light);
    border-radius:50%;
    opacity:0.5;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; }
    50%{ opacity:0.9; }
  }

  .scene{
    position:relative;
    z-index:1;
    width:100%;
    max-width:560px;
  }

  .brand{
    text-align:center;
    margin-bottom:18px;
    font-family:'Fraunces', serif;
    font-size:15px;
    letter-spacing:0.08em;
    color:var(--gold);
    opacity:0.85;
  }




  .minigame-toggle{
    position:fixed;
    top:20px;
    left:20px;
    z-index:2;
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(159,216,255,0.05);
    border:1px solid rgba(159,216,255,0.16);
    color:var(--muted);
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    border-radius:999px;
    padding:7px 14px 7px 10px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .minigame-toggle:hover{
    border-color:var(--star-light);
    color:var(--white);
  }
  .minigame-toggle.off{
    opacity:0.55;
  }
  .minigame-toggle.off #minigameToggleIcon{
    filter:grayscale(1);
  }
  @media (max-width:480px){
    .minigame-toggle{ top:14px; left:14px; padding:6px 10px 6px 8px; font-size:11.5px; }
  }



  .score-badge{
    margin-top:22px;
    padding:16px 18px;
    background:rgba(242,197,114,0.08);
    border:1px solid rgba(242,197,114,0.28);
    border-radius:12px;
    text-align:center;
  }
  .score-percent{
    font-family:'Fraunces', serif;
    font-size:36px;
    font-weight:600;
    color:var(--gold);
    display:block;
    line-height:1.1;
  }
  .score-detail{
    font-size:13px;
    color:var(--muted);
    display:block;
    margin-top:6px;
  }

  .hggsp-center{
    display:flex;
    justify-content:center;
    padding:20px 0;
  }
  .hggsp-btn{
    background:linear-gradient(135deg, rgba(242,197,114,0.12), rgba(159,216,255,0.08));
    border:1px solid rgba(242,197,114,0.35);
    border-radius:16px;
    padding:36px 48px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.15s ease, transform 0.1s ease;
    color:var(--white);
    font-family:'Fraunces', serif;
  }
  .hggsp-btn:hover{
    border-color:var(--gold);
    transform:scale(1.02);
  }
  .hggsp-title{
    font-size:26px;
    font-weight:600;
    color:var(--gold);
    display:block;
  }
  .hggsp-sub{
    font-size:13px;
    color:var(--muted);
    margin-top:6px;
    font-family:'Inter', sans-serif;
  }

  .bac-theme-grid{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bac-theme-card{
    background:rgba(159,216,255,0.05);
    border:1px solid rgba(159,216,255,0.16);
    border-radius:12px;
    padding:16px 18px;
    text-align:left;
    cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease;
    color:var(--white);
    font-family:'Inter', sans-serif;
  }
  .bac-theme-card:hover{
    border-color:var(--star-light);
    background:rgba(159,216,255,0.1);
  }
  .bac-theme-num{
    font-size:11px;
    color:var(--gold);
    letter-spacing:0.05em;
    display:block;
    margin-bottom:3px;
  }
  .bac-theme-label{
    font-size:14.5px;
    font-weight:600;
  }

  .bac-section-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .bac-section-card{
    background:rgba(159,216,255,0.05);
    border:1px solid rgba(159,216,255,0.16);
    border-radius:12px;
    padding:20px 14px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease;
    color:var(--white);
    font-family:'Inter', sans-serif;
  }
  .bac-section-card:hover{
    border-color:var(--star-light);
    background:rgba(159,216,255,0.1);
  }
  .bac-section-label{
    font-size:14px;
    font-weight:600;
    display:block;
  }
  .bac-section-count{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }

  @media (max-width:480px){
    .hggsp-btn{ padding:28px 32px; }
    .bac-section-grid{ grid-template-columns:1fr; }
  }

  .diff-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
  }
  .diff-card{
    background:rgba(159,216,255,0.05);
    border:1px solid rgba(159,216,255,0.16);
    border-radius:12px;
    padding:22px 14px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease;
    color:var(--white);
    font-family:'Inter', sans-serif;
  }
  .diff-card:hover{
    border-color:var(--star-light);
    background:rgba(159,216,255,0.1);
  }
  .diff-card.diff-easy:hover{ border-color:#7fd99a; }
  .diff-card.diff-hard:hover{ border-color:var(--error); }
  .diff-card.diff-normal:hover{ border-color:var(--star-light); }
  .diff-grid-3{
    grid-template-columns:1fr 1fr 1fr;
  }
  .diff-tag.normal{ background:rgba(159,216,255,0.15); color:var(--star-light); }
  @media (max-width:480px){
    .diff-grid.diff-grid-3{ grid-template-columns:1fr; }
  }
  .diff-icon{
    font-size:26px;
    display:block;
    margin-bottom:8px;
  }
  .diff-label{
    font-size:15px;
    font-weight:600;
    display:block;
  }
  .diff-count{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }
  .diff-tag{
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    margin-left:6px;
    white-space:nowrap;
  }
  .diff-tag.easy{ background:rgba(127,217,154,0.15); color:#7fd99a; }
  .diff-tag.hard{ background:rgba(224,138,138,0.15); color:var(--error); }
  .back-link{
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Inter', sans-serif;
    font-size:13px;
    cursor:pointer;
    padding:6px 0;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .back-link:hover{ color:var(--star-light); }

  @media (max-width:480px){
    .diff-grid{ grid-template-columns:1fr 1fr; gap:8px; }
    .diff-card{ padding:16px 8px; }
  }


  .site-footer{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-top:20px;
    font-size:12px;
    color:var(--muted);
  }
  .site-footer a{
    color:var(--muted);
    text-decoration:none;
  }
  .site-footer a:hover{
    color:var(--star-light);
  }
  .site-footer span{
    opacity:0.5;
  }

  .nav-tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .nav-tab{
    background:rgba(159,216,255,0.05);
    border:1px solid rgba(159,216,255,0.16);
    color:var(--muted);
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .nav-tab.active{
    background:rgba(242,197,114,0.12);
    border-color:var(--gold);
    color:var(--gold);
  }
  .nav-tab:hover:not(.active){
    border-color:var(--star-light);
    color:var(--white);
  }

  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .cat-card{
    background:rgba(159,216,255,0.05);
    border:1px solid rgba(159,216,255,0.16);
    border-radius:12px;
    padding:16px 14px;
    text-align:left;
    cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease;
    color:var(--white);
    font-family:'Inter', sans-serif;
  }
  .cat-card:hover{
    border-color:var(--star-light);
    background:rgba(159,216,255,0.1);
  }
  .cat-emoji{
    font-size:22px;
    display:block;
    margin-bottom:6px;
  }
  .cat-label{
    font-size:14px;
    font-weight:600;
    display:block;
  }
  .cat-count{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
  }

  .theme-progress-bar{
    height:6px;
    border-radius:999px;
    background:rgba(159,216,255,0.1);
    overflow:hidden;
    margin-bottom:22px;
  }
  .theme-progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--star-light), var(--gold));
    transition:width 0.3s ease;
  }

  @media (max-width:480px){
    .cat-grid{ grid-template-columns:1fr; }
  }


  .explanation-box{
    margin-top:18px;
    padding:16px 18px;
    background:rgba(242,197,114,0.08);
    border:1px solid rgba(242,197,114,0.25);
    border-radius:12px;
    animation:fadeIn 0.25s ease;
  }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .explanation-text{
    font-size:14px;
    line-height:1.55;
    color:var(--white);
    margin:0 0 14px 0;
  }
  .continue-btn{
    background:var(--gold);
    border:none;
    color:var(--bg-deep);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    transition:filter 0.15s ease, transform 0.1s ease;
  }
  .continue-btn:hover{ filter:brightness(1.08); }
  .continue-btn:active{ transform:scale(0.98); }

  .streak-badge{
    position:fixed;
    top:20px;
    right:20px;
    z-index:2;
    display:none;
    align-items:center;
    gap:6px;
    background:rgba(242,197,114,0.1);
    border:1px solid rgba(242,197,114,0.35);
    border-radius:999px;
    padding:7px 14px 7px 10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .streak-badge .flame{
    font-size:17px;
    line-height:1;
    animation:flicker 1.6s ease-in-out infinite;
  }
  .streak-badge .count{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15px;
    color:var(--gold);
  }
  @keyframes flicker{
    0%,100%{ transform:scale(1) rotate(0deg); opacity:1; }
    50%{ transform:scale(1.12) rotate(-3deg); opacity:0.85; }
  }
  @media (max-width:480px){
    .streak-badge{ top:14px; right:14px; padding:6px 12px 6px 9px; }
  }

  .card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:44px 40px;
    box-shadow:0 30px 80px rgba(0,0,0,0.45);
  }

  .eyebrow{
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.02em;
    margin:0 0 18px 0;
  }
  .eyebrow strong{
    color:var(--gold);
    font-weight:600;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(24px, 4.2vw, 32px);
    line-height:1.35;
    color:var(--white);
    margin:0 0 30px 0;
  }
  h1 .accent{
    color:var(--star-light);
  }

  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .choice{
    text-align:left;
    background:rgba(159,216,255,0.05);
    border:1px solid rgba(159,216,255,0.16);
    color:var(--white);
    font-family:'Inter', sans-serif;
    font-size:15.5px;
    padding:14px 18px;
    border-radius:10px;
    cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .choice:hover{
    border-color:var(--star-light);
    background:rgba(159,216,255,0.1);
  }
  .choice:active{
    transform:scale(0.99);
  }
  .choice.correct{
    border-color:var(--gold);
    background:rgba(242,197,114,0.14);
  }
  .choice.wrong{
    border-color:var(--error);
    background:rgba(224,138,138,0.14);
  }
  .choice[disabled]{ cursor:default; }

  .footer-row{
    margin-top:28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
  }
  .streak{
    color:var(--gold);
  }

  /* --- Done screen --- */
  .done .big{
    font-family:'Fraunces', serif;
    font-size:clamp(28px, 5vw, 38px);
    color:var(--gold);
    margin:0 0 10px 0;
  }
  .done p{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    margin:0;
  }

  /* --- Minigame --- */

  .mg-why{
    font-size:13px;
    color:var(--error);
    background:rgba(224,138,138,0.08);
    border:1px solid rgba(224,138,138,0.22);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:18px;
    line-height:1.4;
  }

  .mg-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .mg-title{
    font-family:'Fraunces', serif;
    font-size:20px;
    color:var(--star-light);
    margin:0;
  }
  .mg-timer{
    font-variant-numeric:tabular-nums;
    font-size:14px;
    color:var(--muted);
  }
  .mg-timer.low{ color:var(--error); }

  .mg-instructions{
    font-size:14px;
    color:var(--muted);
    margin:0 0 20px 0;
    line-height:1.5;
  }

  /* reflex game */
  .mg-field{
    position:relative;
    width:100%;
    height:220px;
    border-radius:12px;
    background:rgba(159,216,255,0.04);
    border:1px solid rgba(159,216,255,0.12);
    overflow:hidden;
  }
  .mg-star{
    position:absolute;
    width:34px;
    height:34px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff, var(--star-light));
    box-shadow:0 0 16px rgba(159,216,255,0.7);
    cursor:pointer;
    border:none;
    animation:pop 0.2s ease;
  }
  @keyframes pop{ from{ transform:scale(0.4); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .mg-progress{
    margin-top:14px;
    font-size:13px;
    color:var(--muted);
  }

  /* simon game */
  .mg-simon-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .mg-simon-btn{
    height:80px;
    border-radius:12px;
    border:1px solid rgba(159,216,255,0.16);
    cursor:pointer;
    transition:filter 0.1s ease, transform 0.08s ease;
  }
  .mg-simon-btn:active{ transform:scale(0.97); }
  .mg-simon-btn.lit{ filter:brightness(1.8); }
  .c0{ background:#3a6ea5; }
  .c1{ background:#8a5fc2; }
  .c2{ background:#4fae8f; }
  .c3{ background:#c2794f; }

  /* math game */
  .mg-math-q{
    font-family:'Fraunces', serif;
    font-size:26px;
    color:var(--white);
    margin:20px 0 20px 0;
    text-align:center;
  }
  .mg-math-choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  @media (max-width:480px){
    .card{ padding:32px 24px; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<div class="streak-badge" id="streakBadge">
  <span class="flame">🔥</span>
  <span class="count"><span id="streakCount">0</span> j</span>
</div>

<button class="minigame-toggle" id="minigameToggle" title="Activer ou desactiver les mini-jeux en cas de mauvaise reponse">
  <span id="minigameToggleIcon">🎮</span>
  <span id="minigameToggleLabel">Mini-jeux : activés</span>
</button>

<div class="scene">
  <div class="brand">QI+1</div>
  <div class="nav-tabs" id="navTabs">
    <button class="nav-tab active" data-tab="daily">🌙 Défi du jour</button>
    <button class="nav-tab" data-tab="themes">📚 Thématiques</button>
    <button class="nav-tab" data-tab="bac">🎓 Révision Bac</button>
  </div>
  <div class="card" id="card">
    <!-- injected by JS -->
  </div>
  <div class="site-footer">
    <a href="a-propos.html">À propos</a>
    <span>&middot;</span>
    <a href="contact.html">Contact</a>
    <span>&middot;</span>
    <a href="confidentialite.html">Confidentialité</a>
  </div>
</div>

<script>
/* ---------------------------------------------------------
   Banque de questions de culture générale
--------------------------------------------------------- */
const BAC_DATA = {
  "t1": {
    label: "De nouveaux espaces de conquête",
    sections: {
      intro: [
        { q:"Quels sont les deux nouveaux espaces étudiés dans ce thème ?", choices:["Les espaces terrestres et aériens.","Les espaces urbains et ruraux.","Les espaces océaniques et extra-atmosphériques.","Les espaces polaires et désertiques."], a:2 },
        { q:"Pourquoi peut-on parler de « nouveaux espaces de conquête » ?", choices:["Parce qu'ils sont progressivement explorés, maîtrisés et exploités grâce aux progrès scientifiques et technologiques.","Parce qu'ils sont désormais accessibles uniquement aux grandes puissances historiques.","Parce qu'ils ont été découverts très récemment, au XXIe siècle.","Parce qu'ils ne sont soumis à aucune règle internationale."], a:0 },
        { q:"Pourquoi la maîtrise de ces espaces est-elle un enjeu de puissance ?", choices:["Parce qu'elle ne concerne que les questions environnementales.","Parce qu'elle permet d'accéder à des ressources, de développer des activités économiques et d'accroître les capacités militaires et stratégiques d'un État.","Parce qu'elle permet uniquement de développer le tourisme.","Parce qu'elle est obligatoire selon le droit international."], a:1 },
        { q:"Pourquoi les océans et l'espace restent-ils difficiles à maîtriser ?", choices:["En raison de l'interdiction des traités internationaux.","En raison du manque d'intérêt des grandes puissances.","En raison de l'absence totale de technologies adaptées.","En raison de leurs contraintes physiques et de l'immensité des espaces concernés."], a:3 },
        { q:"Quels sont les principaux enjeux liés à ces espaces ?", choices:["Uniquement les interdire d'accès aux États non membres de l'ONU.","Uniquement développer le tourisme spatial et maritime.","Explorer, exploiter, protéger et contrôler, mais aussi coopérer pour les gérer.","Uniquement les coloniser et les peupler."], a:2 },
      ],
      axe1: [
        { q:"Quand commence véritablement la course à l'espace ?", choices:["Dans les années 1970, après la guerre du Vietnam.","Dans les années 1950, pendant la guerre froide.","Dans les années 1990, après la chute de l'URSS.","Dans les années 1930, avant la Seconde Guerre mondiale."], a:1 },
        { q:"Quels sont les deux principaux acteurs de la première course à l'espace ?", choices:["L'URSS et l'Allemagne.","La France et le Royaume-Uni.","Les États-Unis et la Chine.","Les États-Unis et l'URSS."], a:3 },
        { q:"Quel événement soviétique marque le début de l'ère spatiale en 1957 ?", choices:["Le lancement de la sonde Luna 2.","Le lancement de Spoutnik 1, premier satellite artificiel.","Le premier vol habité de Youri Gagarine.","La création de l'agence spatiale soviétique."], a:1 },

  { q:"Quelle est la capitale de la Suisse ?", choices:["Genève","Zurich","Berne","Lausanne"], a:2, exp:"Berne n'est pourtant pas la plus grande ville du pays : Zurich et Genève comptent toutes deux plus d'habitants." },

  { q:"Quel est le plus long fleuve d'Europe ?", choices:["Le Danube","La Volga","Le Rhin","La Loire"], a:1 },

  { q:"Quel est le principal métal utilisé dans la fabrication des piles rechargeables au lithium ?", choices:["Le nickel","Le lithium","Le cobalt","Le plomb"], a:1 },

  { q:"Quel est le plus grand serpent du monde en longueur ?", choices:["Le cobra royal","L'anaconda vert","Le python réticulé","Le boa constrictor"], a:2, exp:"Un python réticulé peut dépasser 6 mètres de long, mais reste bien plus léger que l'anaconda vert à taille égale." },
  { q:"Quel compositeur allemand a écrit « La Marche nuptiale » ?", choices:["Mendelssohn","Wagner","Schumann","Brahms"], a:0, exp:"Cette marche, bien que composée pour une pièce de théâtre inspirée du Songe d'une nuit d'été de Shakespeare, est devenue l'un des morceaux les plus joués lors des mariages dans le monde entier." },
  { q:"Quelle est la capitale de l'Éthiopie ?", choices:["Addis-Abeba","Dire Dawa","Gondar","Mekele"], a:0, exp:"Addis-Abeba signifie « nouvelle fleur » en amharique, et abrite le siège de l'Union africaine, faisant de la ville une sorte de capitale diplomatique du continent." },
  { q:"Quel est le nom du processus par lequel les cellules produisent de l'énergie à partir du glucose ?", choices:["La photosynthèse","La respiration cellulaire","La fermentation","La glycolyse anaérobie"], a:1 },
  { q:"Quel roi de France a fait construire le château de Versailles ?", choices:["Henri IV","Louis XIII","Louis XIV","Louis XV"], a:2, exp:"Le château comptait à son apogée plus de 2 000 pièces, et Louis XIV y installa toute sa cour pour mieux la contrôler et affaiblir la noblesse." },
  { q:"Quelle est la capitale du Nigeria ?", choices:["Lagos","Abuja","Kano","Ibadan"], a:1 },
  { q:"Quel est le nom du détroit qui sépare l'Asie de l'Amérique du Nord ?", choices:["Le détroit de Béring","Le détroit de Davis","Le détroit de Magellan","Le détroit de Malacca"], a:0, exp:"À son point le plus étroit, seulement environ 82 kilomètres séparent l'Asie de l'Amérique, et les eaux y gèlent parfois suffisamment en hiver pour permettre la traversée à pied." },
  { q:"Quel peintre italien a peint le plafond de la chapelle Sixtine ?", choices:["Raphaël","Léonard de Vinci","Michel-Ange","Le Caravage"], a:2, exp:"Michel-Ange a peint allongé sur le dos, sur un échafaudage suspendu, pendant près de quatre ans, et se plaignait que la peinture lui coulait constamment sur le visage." },
  { q:"Quelle est la capitale du Ghana ?", choices:["Kumasi","Accra","Tamale","Cape Coast"], a:1 },
  { q:"Quel est le nom de l'unité de base du courant électrique ?", choices:["Le volt","L'ampère","Le coulomb","L'ohm"], a:1, exp:"L'ampère porte le nom d'André-Marie Ampère, un scientifique français considéré comme l'un des pères fondateurs de l'électromagnétisme." },
  { q:"Quelle guerre a opposé le Nord et le Sud des États-Unis entre 1861 et 1865 ?", choices:["La guerre d'indépendance","La guerre de Sécession","La guerre hispano-américaine","La guerre de 1812"], a:1, exp:"Ce conflit reste, à ce jour, le plus meurtrier de l'histoire des États-Unis, avec environ 620 000 soldats tués." },
  { q:"Quelle est la capitale de la Thaïlande ?", choices:["Chiang Mai","Bangkok","Phuket","Pattaya"], a:1 },
  { q:"Quel est le mammifère le plus lent du monde ?", choices:["Le paresseux","La tortue géante","L'escargot","Le koala"], a:0, exp:"Le paresseux se déplace si lentement qu'une algue verte pousse parfois directement sur son pelage, lui offrant un camouflage naturel dans la canopée." },
  { q:"Quel mathématicien grec est célèbre pour son théorème sur les triangles rectangles ?", choices:["Euclide","Archimède","Pythagore","Thalès"], a:2, exp:"Bien que ce théorème porte son nom, des civilisations comme les Babyloniens semblent l'avoir déjà connu et utilisé bien avant lui." },
  { q:"Quelle est la capitale du Vietnam ?", choices:["Hô Chi Minh-Ville","Hanoï","Da Nang","Hué"], a:1 },
  { q:"Quel est le nom du phénomène lumineux visible près des pôles ?", choices:["L'arc-en-ciel","L'aurore boréale","L'éclipse","Le halo solaire"], a:1, exp:"Ce phénomène est provoqué par des particules chargées venues du Soleil qui entrent en collision avec l'atmosphère terrestre près des pôles magnétiques." },
  { q:"Quel navigateur portugais a été le premier à faire le tour du monde (son expédition l'a achevé) ?", choices:["Vasco de Gama","Christophe Colomb","Fernand de Magellan","Bartolomeu Dias"], a:2, exp:"Magellan lui-même est mort aux Philippines avant la fin du voyage ; seul un des cinq navires de son expédition a finalement bouclé le tour du monde." },
  { q:"Quelle est la capitale de l'Indonésie ?", choices:["Bali","Jakarta","Surabaya","Bandung"], a:1 },
  { q:"Quel est le nom de la plus grande forêt tropicale du monde ?", choices:["La forêt du Congo","La forêt amazonienne","La forêt de Bornéo","La forêt de Daintree"], a:1, exp:"La forêt amazonienne produit à elle seule environ 20 % de l'oxygène généré par l'ensemble de la végétation terrestre de la planète." },
  { q:"Quel philosophe allemand a écrit « Ainsi parlait Zarathoustra » ?", choices:["Emmanuel Kant","Friedrich Nietzsche","Georg Hegel","Arthur Schopenhauer"], a:1, exp:"Nietzsche a sombré dans la folie durant les dix dernières années de sa vie, et n'a jamais connu la notoriété immense que son œuvre allait connaître après sa mort." },
  { q:"Quelle est la capitale de la Malaisie ?", choices:["Penang","Kuala Lumpur","Johor Bahru","Ipoh"], a:1 },

  { q:"Quelle est la capitale des Philippines ?", choices:["Cebu","Davao","Manille","Quezon City"], a:2 },
  { q:"Quel est le nom du vaisseau spatial qui a amené les premiers hommes sur la Lune en 1969 ?", choices:["Apollo 11","Apollo 13","Gemini 8","Soyouz 1"], a:0, exp:"Le module lunaire d'Apollo 11 ne disposait que d'un ordinateur de bord dont la puissance de calcul était largement inférieure à celle d'une calculatrice de poche actuelle." },
  { q:"Quel compositeur russe a écrit le ballet « Le Lac des cygnes » ?", choices:["Stravinsky","Tchaïkovski","Rachmaninov","Prokofiev"], a:1, exp:"Le Lac des cygnes a été un échec lors de sa première représentation en 1877 ; ce n'est qu'après la mort de Tchaïkovski qu'il est devenu l'un des ballets les plus joués au monde." },

  { q:"Quel écrivain a créé le personnage de Dracula ?", choices:["Mary Shelley","Bram Stoker","Robert Louis Stevenson","H.P. Lovecraft"], a:1, exp:"Bram Stoker s'est en partie inspiré du prince roumain Vlad III, surnommé « l'Empaleur », pour créer son personnage." },
  { q:"Quelle est la capitale de l'Irak ?", choices:["Bassorah","Bagdad","Mossoul","Erbil"], a:1 },

  { q:"Quel empire précolombien a été conquis par Hernán Cortés ?", choices:["L'empire inca","L'empire aztèque","L'empire maya","L'empire olmèque"], a:1, exp:"Cortés n'avait qu'environ 500 hommes, mais a profité des rivalités entre peuples soumis aux Aztèques et d'épidémies apportées d'Europe pour vaincre un empire de plusieurs millions d'habitants." },
  { q:"Quelle est la capitale de l'Iran ?", choices:["Ispahan","Chiraz","Téhéran","Machhad"], a:2 },

  { q:"Quelle mer est bordée par Israël, l'Égypte, la Jordanie et l'Arabie saoudite au niveau du golfe d'Aqaba ?", choices:["La mer Morte","La mer Rouge","La mer Méditerranée","La mer Noire"], a:1 },
  { q:"Quel est le nom du processus géologique qui explique le déplacement des continents ?", choices:["La subduction","La tectonique des plaques","L'érosion","Le volcanisme"], a:1 },

  { q:"Quelle est la capitale de l'Arabie saoudite ?", choices:["Djeddah","La Mecque","Riyad","Médine"], a:2 },

  { q:"Quelle guerre a opposé la Grèce antique à l'Empire perse au Ve siècle av. J.-C. ?", choices:["Les guerres médiques","La guerre du Péloponnèse","La guerre de Troie","Les guerres puniques"], a:0, exp:"C'est lors de ces guerres qu'a eu lieu la célèbre bataille des Thermopyles, où une petite troupe de soldats grecs, dont 300 Spartiates, résista un temps face à une armée perse bien plus nombreuse." },
  { q:"Quelle est la capitale du Pakistan ?", choices:["Karachi","Lahore","Islamabad","Peshawar"], a:2 },

  { q:"Quel compositeur allemand est l'auteur de l'opéra « Tristan et Isolde » ?", choices:["Richard Wagner","Richard Strauss","Johannes Brahms","Carl Maria von Weber"], a:0, exp:"Cet opéra est réputé pour un accord musical si dissonant et novateur, appelé « accord de Tristan », que certains musicologues y voient une annonce de la musique du XXe siècle." },
  { q:"Quelle est la capitale de Cuba ?", choices:["Santiago de Cuba","La Havane","Varadero","Camagüey"], a:1, exp:"La Havane est réputée pour ses milliers de voitures américaines des années 1950, toujours en circulation faute d'accès facile aux importations automobiles modernes." },
  { q:"Dans quel pays se trouve le désert d'Atacama, réputé comme l'un des plus arides au monde ?", choices:["Le Pérou","Le Chili","La Bolivie","L'Argentine"], a:1, exp:"Certaines zones de l'Atacama n'ont reçu aucune pluie mesurable depuis le début des relevés météorologiques, ce qui en fait l'un des endroits les plus secs de la planète." },
  { q:"Quel traité européen a créé l'Union européenne en 1993 ?", choices:["Le traité de Rome","Le traité de Maastricht","Le traité de Lisbonne","Le traité d'Amsterdam"], a:1, exp:"Ce traité a aussi posé les bases de la monnaie unique européenne, l'euro, qui n'entrera en circulation que huit ans plus tard, en 2002." },

  { q:"Quel écrivain français a écrit « Le Petit Prince » ?", choices:["Marcel Pagnol","Antoine de Saint-Exupéry","Jean Giono","Albert Camus"], a:1, exp:"Saint-Exupéry était lui-même aviateur ; il a disparu en vol au-dessus de la Méditerranée en 1944." },
  { q:"Quelle est la capitale du Sri Lanka (capitale administrative) ?", choices:["Colombo","Kandy","Sri Jayawardenepura Kotte","Galle"], a:2, exp:"Colombo demeure la capitale économique et la ville la plus peuplée, malgré ce transfert administratif en périphérie dans les années 1980." },
  { q:"Quel est le nom du courant artistique auquel appartient Picasso avec Georges Braque, basé sur la décomposition des formes ?", choices:["Le fauvisme","Le cubisme","Le surréalisme","L'expressionnisme"], a:1 },
  { q:"Quelle bataille navale a vu la flotte franco-espagnole vaincue par les Britanniques en 1805 ?", choices:["La bataille de Trafalgar","La bataille du Nil","La bataille de Jutland","La bataille de Lépante"], a:0, exp:"L'amiral britannique Nelson, vainqueur de cette bataille, y a trouvé la mort, touché par un tireur isolé alors que la victoire était déjà acquise." },

  { q:"Quel roi de Prusse et futur empereur allemand a été proclamé à Versailles en 1871 ?", choices:["Frédéric II","Guillaume Ier","Guillaume II","Otto von Bismarck"], a:1, exp:"Ce sacre a eu lieu dans la galerie des Glaces du château de Versailles, un choix perçu comme une humiliation par la France vaincue." },

  { q:"Quelle est la capitale de l'Islande ?", choices:["Akureyri","Reykjavik","Keflavik","Hafnarfjörður"], a:1, exp:"Reykjavik est la capitale la plus septentrionale du monde parmi les capitales de pays souverains." },

  { q:"Quel physicien français a découvert la radioactivité en 1896 ?", choices:["Pierre Curie","Henri Becquerel","Paul Langevin","Jean Perrin"], a:1, exp:"Becquerel a fait cette découverte presque par hasard, en remarquant qu'un minerai d'uranium impressionnait une plaque photographique même sans exposition à la lumière." },
  { q:"Quelle scientifique a remporté deux prix Nobel dans deux disciplines différentes (physique et chimie) ?", choices:["Rosalind Franklin","Marie Curie","Lise Meitner","Ada Lovelace"], a:1, exp:"Marie Curie reste, à ce jour, la seule personne à avoir reçu deux prix Nobel dans deux domaines scientifiques différents, la physique et la chimie." },
  { q:"Qui a composé l'opéra « La Traviata » ?", choices:["Puccini","Verdi","Rossini","Donizetti"], a:1, exp:"Cet opéra a d'abord été un échec cuisant lors de sa première à Venise en 1853, avant de devenir l'un des opéras les plus joués au monde." },
  { q:"Qui a écrit le roman « Don Quichotte » ?", choices:["Lope de Vega","Miguel de Cervantès","Federico García Lorca","Calderón de la Barca"], a:1, exp:"Cervantès a écrit une partie de ce roman alors qu'il était emprisonné ; l'ouvrage est aujourd'hui considéré comme l'un des tout premiers romans modernes de la littérature occidentale." },
  { q:"Qui a peint le tableau « Les Ménines » ?", choices:["Francisco de Goya","Diego Velázquez","El Greco","Bartolomé Murillo"], a:1, exp:"Vélasquez s'est lui-même représenté en train de peindre dans ce tableau, créant une mise en abyme qui a fasciné des générations d'historiens de l'art." },

  { q:"Quelle est l'unité de mesure de la fréquence ?", choices:["Le watt","Le hertz","Le joule","Le lumen"], a:1, exp:"Le hertz porte le nom d'Heinrich Hertz, qui a démontré l'existence des ondes électromagnétiques en 1887." },

  { q:"À quel siège célèbre de 1429 le nom de Jeanne d'Arc est-il associé ?", choices:["Le siège de Paris","Le siège d'Orléans","Le siège de Calais","Le siège de Rouen"], a:1 },
  { q:"Quel peintre français est à l'origine du pointillisme, avec « Un dimanche après-midi à l'Île de la Grande Jatte » ?", choices:["Paul Signac","Georges Seurat","Camille Pissarro","Paul Cézanne"], a:1, exp:"La technique du pointillisme demande une telle minutie que Seurat a mis environ deux ans à achever ce tableau, peint à partir de milliers de petits points de couleur pure." },

  { q:"Quel roi de France a été guillotiné pendant la Révolution française ?", choices:["Louis XV","Louis XVI","Louis XVIII","Charles X"], a:1, exp:"Louis XVI a été exécuté le 21 janvier 1793 sur la place de la Révolution, l'actuelle place de la Concorde à Paris." },

  { q:"Quel pays possède le littoral le plus long du monde ?", choices:["L'Indonésie","La Russie","Le Canada","L'Australie"], a:2, exp:"Grâce à ses innombrables îles et fjords, le littoral canadien est si découpé que sa longueur exacte varie selon l'échelle de mesure utilisée — un phénomène appelé le paradoxe du littoral." },

  { q:"Quel peintre français est considéré comme le chef de file du mouvement fauviste ?", choices:["André Derain","Henri Matisse","Maurice de Vlaminck","Raoul Dufy"], a:1, exp:"Le nom « fauvisme » vient d'une critique moqueuse d'un journaliste, choqué par les couleurs violentes de ces peintres, qu'il a comparés à des « fauves »." },
  { q:"Quel compositeur norvégien a écrit la musique de scène « Peer Gynt » ?", choices:["Jean Sibelius","Edvard Grieg","Carl Nielsen","Niels Gade"], a:1 },
  { q:"Qui a écrit le roman « Ulysse » ?", choices:["Samuel Beckett","James Joyce","Oscar Wilde","George Bernard Shaw"], a:1, exp:"Ce roman a été interdit de publication aux États-Unis et au Royaume-Uni pendant plusieurs années pour obscénité, avant d'être levé après un procès retentissant." },
  { q:"Quel traité a mis fin à la guerre de Trente Ans en 1648 ?", choices:["Le traité de Westphalie","Le traité d'Utrecht","Le traité de Vienne","Le traité de Tordesillas"], a:0, exp:"Ce traité a aussi posé les bases du concept moderne de souveraineté des États-nations, encore en vigueur aujourd'hui." },
  { q:"Quel empereur romain a légalisé le christianisme dans l'Empire avec l'édit de Milan en 313 ?", choices:["Dioclétien","Constantin Ier","Théodose Ier","Néron"], a:1, exp:"Constantin se serait converti après avoir vu un signe dans le ciel avant une bataille décisive." },
  { q:"Quelle reine britannique détenait le record du règne le plus long avant qu'Elizabeth II ne le batte en 2015 ?", choices:["La reine Anne","La reine Victoria","La reine Élisabeth Ire","La reine Marie Ire"], a:1, exp:"La reine Victoria a régné 63 ans, une période si marquante qu'elle a donné son nom à toute une époque." },
  { q:"Quelle pharaonne égyptienne se faisait représenter avec les attributs traditionnels du pouvoir royal, dont une fausse barbe ?", choices:["Néfertiti","Hatchepsout","Cléopâtre","Nefertari"], a:1, exp:"Hatchepsout se faisait représenter avec cette fausse barbe rituelle, symbole du pouvoir pharaonique, pour asseoir sa légitimité dans un rôle traditionnellement masculin." },

  { q:"Quels deux savants ont développé indépendamment le calcul infinitésimal au XVIIe siècle ?", choices:["Newton et Leibniz","Pascal et Descartes","Euler et Gauss","Fermat et Huygens"], a:0, exp:"Cette découverte simultanée a donné lieu à l'une des plus grandes querelles de priorité de l'histoire des sciences, les deux savants s'accusant mutuellement de plagiat." },
  { q:"Quel médecin allemand a établi des critères permettant d'identifier un agent infectieux, en rival scientifique de Pasteur ?", choices:["Rudolf Virchow","Robert Koch","Paul Ehrlich","Emil von Behring"], a:1, exp:"Robert Koch a reçu le prix Nobel de médecine en 1905 pour ses travaux sur la tuberculose, une maladie qu'il a mieux comprise en identifiant le bacille responsable." },
  { q:"Quel physicien allemand a découvert les rayons X en 1895 ?", choices:["Max Planck","Wilhelm Röntgen","Werner Heisenberg","Heinrich Hertz"], a:1, exp:"Röntgen a reçu le tout premier prix Nobel de physique en 1901 pour cette découverte, et a refusé de la breveter pour qu'elle profite à tous." },
  { q:"Quel chimiste russe est à l'origine du tableau périodique des éléments, en 1869 ?", choices:["Dmitri Mendeleïev","Antoine Lavoisier","Marie Curie","Amedeo Avogadro"], a:0, exp:"Mendeleïev avait laissé des cases vides dans son tableau, prédisant avec succès l'existence d'éléments encore non découverts." },
  { q:"Quel peintre néerlandais a peint « La Ronde de nuit » ?", choices:["Vermeer","Rembrandt","Frans Hals","Jan Steen"], a:1, exp:"Ce tableau doit en partie son nom à une couche de vernis qui avait noirci avec le temps, donnant à tort l'impression d'une scène nocturne alors qu'elle se déroule en plein jour." },
  { q:"Quel peintre néerlandais a peint « La Jeune Fille à la perle » ?", choices:["Rembrandt","Vermeer","Pieter de Hooch","Gerard Dou"], a:1, exp:"On ne connaît presque rien de l'identité de la jeune femme représentée, ce qui a valu à ce tableau le surnom de « Joconde du Nord »." },
  { q:"Quel peintre autrichien a peint « Le Baiser » ?", choices:["Egon Schiele","Gustav Klimt","Oskar Kokoschka","Koloman Moser"], a:1, exp:"Klimt a recouvert une bonne partie de cette toile de feuilles d'or véritable, une technique héritée de la formation de doreur de son propre père." },
  { q:"Quelle peintre mexicaine est célèbre pour ses nombreux autoportraits ?", choices:["Remedios Varo","Frida Kahlo","Leonora Carrington","María Izquierdo"], a:1, exp:"Frida Kahlo a peint la plupart de ses autoportraits alors qu'elle était clouée au lit, suite à un grave accident de bus survenu à l'âge de 18 ans." },
  { q:"Quel peintre mexicain, époux de Frida Kahlo, est célèbre pour ses fresques murales ?", choices:["David Alfaro Siqueiros","Diego Rivera","José Clemente Orozco","Rufino Tamayo"], a:1 },
  { q:"Quel poète de la Grèce antique est traditionnellement présenté comme l'auteur de l'Iliade et de l'Odyssée ?", choices:["Hésiode","Homère","Sophocle","Pindare"], a:1, exp:"L'existence même d'Homère en tant que personne unique est débattue par les chercheurs, certains pensant que ces épopées seraient l'œuvre de plusieurs auteurs successifs." },

  { q:"Quelle romancière anglaise est l'autrice d'« Orgueil et Préjugés » ?", choices:["Jane Austen","Charlotte Brontë","George Eliot","Virginia Woolf"], a:0, exp:"Jane Austen a publié ses romans de manière anonyme de son vivant, signés simplement « By a Lady »." },

  { q:"Quel écrivain américain a écrit « Le Vieil Homme et la Mer » ?", choices:["William Faulkner","Ernest Hemingway","John Steinbeck","F. Scott Fitzgerald"], a:1, exp:"Ce court roman a valu à Hemingway le prix Pulitzer en 1953 et a grandement contribué à lui faire obtenir le prix Nobel de littérature l'année suivante." },

  { q:"En quelle année est sorti le tout premier film Star Wars, « Un nouvel espoir » ?", choices:["1975","1977","1980","1983"], a:1, exp:"Le film s'appelait simplement « Star Wars » à sa sortie ; le sous-titre « Un nouvel espoir » n'a été ajouté qu'en 1981." },

  { q:"Quel réalisateur britannique a mis en scène le film « Psychose » en 1960 ?", choices:["Alfred Hitchcock","David Lean","Carol Reed","Michael Powell"], a:0, exp:"La célèbre scène de la douche, pourtant courte à l'écran, a nécessité environ une semaine de tournage et plus de 70 angles de caméra différents." },

  { q:"Dans la mythologie grecque, quel dieu est le roi des dieux de l'Olympe ?", choices:["Poséidon","Zeus","Hadès","Apollon"], a:1, exp:"Zeus aurait détrôné son propre père, le titan Cronos, qui avait lui-même dévoré ses enfants par peur d'être renversé." },
  { q:"Quel est le dieu romain de la guerre ?", choices:["Vulcain","Mars","Neptune","Mercure"], a:1, exp:"Le mois de mars tire son nom de ce dieu, car c'était traditionnellement la période où reprenaient les campagnes militaires après l'hiver." },
  { q:"Dans la mythologie nordique, quel dieu est associé au tonnerre et manie le marteau Mjöllnir ?", choices:["Odin","Thor","Loki","Týr"], a:1, exp:"Le personnage de Thor popularisé par Marvel s'inspire directement de ce dieu nordique et de son célèbre marteau Mjöllnir." },
  { q:"Dans la mythologie grecque, quel dieu est le messager des dieux ?", choices:["Hermès","Arès","Héphaïstos","Dionysos"], a:0, exp:"Hermès est aussi le dieu des voleurs, des marchands et des voyageurs, protégeant à la fois le commerce honnête et la ruse." },

  { q:"Dans la mythologie grecque, quel est le nom du cheval ailé né du sang de Méduse ?", choices:["Pégase","Bucéphale","Arion","Xanthos"], a:0, exp:"Selon la légende, Pégase serait né du sang de Méduse au moment même où Persée lui tranchait la tête." },

  { q:"Quel est le plus grand félin du monde, plus grand encore que le lion ?", choices:["Le lion","Le tigre","Le jaguar","Le léopard"], a:1, exp:"Le tigre de Sibérie, le plus grand des tigres, peut peser plus de 300 kg." },
  { q:"Quel oiseau incapable de voler est le symbole animal de la Nouvelle-Zélande ?", choices:["Le kiwi","L'émeu","Le kakapo","Le pingouin"], a:0, exp:"Le kiwi pond un œuf pouvant représenter jusqu'à 20 % du poids de son corps, un record proportionnel chez les oiseaux." },

  { q:"Quelle guerre du Ve siècle av. J.-C. a opposé Athènes et Sparte pour la domination de la Grèce ?", choices:["Les guerres médiques","La guerre du Péloponnèse","La guerre de Corinthe","La guerre lamiaque"], a:1, exp:"Ce conflit a duré environ 27 ans et a durablement affaibli les cités grecques, ouvrant la voie à la future domination macédonienne." },

  { q:"Dans la mythologie grecque, quel dieu règne sur la mer ?", choices:["Zeus","Poséidon","Hadès","Apollon"], a:1, exp:"Poséidon est aussi le dieu des tremblements de terre dans la mythologie grecque, surnommé « l'Ébranleur du sol »." },
  { q:"Dans la mythologie grecque, quel dieu règne sur les enfers ?", choices:["Hadès","Arès","Dionysos","Cronos"], a:0, exp:"Contrairement à une idée reçue, Hadès n'est pas l'équivalent grec du diable : il est simplement le gardien impassible du royaume des morts, ni bon ni mauvais." },

  { q:"Dans la mythologie égyptienne, quel dieu à tête de faucon est associé au ciel et à la royauté ?", choices:["Rê","Horus","Seth","Sobek"], a:1, exp:"Selon la légende, Horus aurait perdu un œil lors d'un combat contre son oncle Seth ; cet « œil d'Horus » reconstitué est devenu un symbole de protection encore utilisé aujourd'hui." },
  { q:"Dans la mythologie grecque, quel titan est condamné à porter le monde sur ses épaules ?", choices:["Prométhée","Atlas","Cronos","Océan"], a:1, exp:"Selon la légende, Atlas fut condamné à cette tâche éternelle pour avoir pris part à la révolte des Titans contre les dieux de l'Olympe." },
  { q:"Dans la mythologie romaine, quel dieu forgeron est l'équivalent du grec Héphaïstos ?", choices:["Mars","Vulcain","Mercure","Neptune"], a:1, exp:"Le mot « volcan » dérive directement du nom de ce dieu romain du feu et de la forge." },

  { q:"Dans la mythologie grecque, quelle déesse, enlevée par Hadès, symbolise le retour du printemps ?", choices:["Déméter","Perséphone","Artémis","Héra"], a:1, exp:"Le mythe explique le cycle des saisons : quand Perséphone remonte auprès de sa mère Déméter, c'est le printemps ; quand elle redescend aux Enfers, c'est l'hiver." },

function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function yesterdayKey(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dayIndex(){
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  return Math.floor((now - start) / 86400000);
}

function classifyDifficulty(q, cat){
  const signals = EASY_SIGNALS[cat] || [];
  return signals.some(sig => new RegExp(sig, "i").test(q.q)) ? "facile" : "difficile";
}

let CATEGORY_POOLS = {};
function buildCategoryPools(){
  CATEGORY_POOLS = {};
  CATEGORIES.forEach(c => CATEGORY_POOLS[c.id] = { facile: [], difficile: [] });
  QUESTIONS.forEach(q => {
    const cat = categorizeQuestion(q);
    if(!CATEGORY_POOLS[cat]) return;
    const diff = classifyDifficulty(q, cat);
    CATEGORY_POOLS[cat][diff].push(q);
  });
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const card = document.getElementById("card");

function pickDailyQuestion(){
  const idx = dayIndex() % QUESTIONS.length;
  usedIndexes = new Set([idx]);
  return QUESTIONS[idx];
}
function pickNextQuestion(){
  const remaining = QUESTIONS.map((_,i)=>i).filter(i=>!usedIndexes.has(i));
  const pool = remaining.length ? remaining : QUESTIONS.map((_,i)=>i);
  const idx = pool[Math.floor(Math.random()*pool.length)];
  usedIndexes.add(idx);
  return QUESTIONS[idx];
}

function pickThemeQuestions(catId, difficulty){
  const pool = difficulty === "normal"
    ? [...CATEGORY_POOLS[catId].facile, ...CATEGORY_POOLS[catId].difficile]
    : CATEGORY_POOLS[catId][difficulty];
  const seenKey = catId + ":" + difficulty;
  let seenSet = new Set(themeSeen[seenKey] || []);
  if(seenSet.size >= pool.length){
    seenSet = new Set(); // tout le pool a deja ete vu, on relance un cycle complet
  }
  const unseen = pool.filter(q => !seenSet.has(q.q));
  const count = Math.min(10, pool.length);
  let chosen;
  if(unseen.length >= count){
    chosen = shuffleArray(unseen).slice(0, count);
  } else {
    const seenPoolQs = pool.filter(q => seenSet.has(q.q));
    const filler = shuffleArray(seenPoolQs).slice(0, count - unseen.length);
    chosen = shuffleArray([...unseen, ...filler]);
  }
  chosen.forEach(q => seenSet.add(q.q));
  themeSeen[seenKey] = Array.from(seenSet);
  return chosen;
}

function startMinigame(){
  const games = [renderReflexGame, renderSimonGame, renderMathGame];
  const game = games[Math.floor(Math.random()*games.length)];
  game();
}

function mgTimerLoop(seconds, onTick, onTimeout, myGen){
  let remaining = seconds;
  onTick(remaining);
  const interval = setInterval(()=>{
    if(myGen !== renderGen){
      clearInterval(interval); // l'utilisateur a change d'onglet, on arrete ce minuteur silencieusement
      return;
    }
    remaining -= 1;
    onTick(remaining);
    if(remaining <= 0){
      clearInterval(interval);
      onTimeout();
    }
  }, 1000);
  return interval;
}

function onMinigameSuccess(){
  if(quizMode === "theme"){
    themeQueue.push(themeQueue.shift());
    renderThemeQuestion();
  } else if(quizMode === "bac"){
    bacQueue.push(bacQueue.shift());
    renderBacQuestion();
  } else {
    renderQuestion(pickNextQuestion(), false);
  }
}
function onMinigameFail(){
  startMinigame();
}

/* --- Jeu 1 : réflexes stellaires --- */
function renderReflexGame(){
  const myGen = renderGen;
  const target = 6;
  let caught = 0;
  card.innerHTML = `
    <p class="mg-why">❌ Mauvaise réponse. Réussis ce petit défi pour retenter ta chance sur une nouvelle question.</p>
    <div class="mg-head">
      <p class="mg-title">Réflexes stellaires</p>
      <span class="mg-timer" id="mg-timer">15s</span>
    </div>
    <p class="mg-instructions">Rattrape ${target} étoiles avant la fin du compte à rebours.</p>
    <div class="mg-field" id="mg-field"></div>
    <p class="mg-progress" id="mg-progress">0 / ${target} attrapées</p>
  `;
  const field = document.getElementById("mg-field");
  const timerEl = document.getElementById("mg-timer");
  const progressEl = document.getElementById("mg-progress");
  let done = false;

  function spawnStar(){
    if(done) return;
    const star = document.createElement("button");
    star.className = "mg-star";
    const fw = field.clientWidth, fh = field.clientHeight;
    star.style.left = Math.random()*(fw-34) + "px";
    star.style.top = Math.random()*(fh-34) + "px";
    star.addEventListener("click", ()=>{
      if(done || myGen !== renderGen) return;
      caught++;
      progressEl.textContent = `${caught} / ${target} attrapées`;
      star.remove();
      if(caught >= target){
        done = true;
        clearInterval(interval);
        onMinigameSuccess();
      } else {
        spawnStar();
      }
    });
    field.appendChild(star);
  }
  spawnStar();

  const interval = mgTimerLoop(15,
    (r)=>{ timerEl.textContent = r+"s"; if(r<=5) timerEl.classList.add("low"); },
    ()=>{ if(!done){ done = true; onMinigameFail(); } },
    myGen
  );
}

/* --- Jeu 2 : suite lumineuse (type Simon) --- */
function renderSimonGame(){
  const myGen = renderGen;
  const colors = ["c0","c1","c2","c3"];
  const seqLength = 4;
  const sequence = Array.from({length:seqLength}, ()=>Math.floor(Math.random()*4));
  let userStep = 0;
  let accepting = false;

  card.innerHTML = `
    <p class="mg-why">❌ Mauvaise réponse. Réussis ce petit défi pour retenter ta chance sur une nouvelle question.</p>
    <div class="mg-head">
      <p class="mg-title">Suite lumineuse</p>
      <span class="mg-timer" id="mg-timer">20s</span>
    </div>
    <p class="mg-instructions">Observe la séquence, puis reproduis-la en cliquant dans le même ordre.</p>
    <div class="mg-simon-grid">
      ${colors.map((c,i)=>`<button class="mg-simon-btn ${c}" data-i="${i}"></button>`).join("")}
    </div>
  `;
  const btns = card.querySelectorAll(".mg-simon-btn");
  const timerEl = document.getElementById("mg-timer");
  let done = false;

  async function playSequence(){
    await sleep(1400); // laisse le temps de lire la consigne avant que la sequence ne demarre
    for(const idx of sequence){
      await sleep(280);
      btns[idx].classList.add("lit");
      await sleep(380);
      btns[idx].classList.remove("lit");
    }
    accepting = true;
  }
  playSequence();

  btns.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!accepting || done || myGen !== renderGen) return;
      const idx = parseInt(btn.dataset.i);
      btn.classList.add("lit");
      setTimeout(()=>btn.classList.remove("lit"), 150);
      if(idx === sequence[userStep]){
        userStep++;
        if(userStep === sequence.length){
          done = true;
          clearInterval(interval);
          onMinigameSuccess();
        }
      } else {
        done = true;
        clearInterval(interval);
        onMinigameFail();
      }
    });
  });

  const interval = mgTimerLoop(20,
    (r)=>{ timerEl.textContent = r+"s"; if(r<=5) timerEl.classList.add("low"); },
    ()=>{ if(!done){ done = true; onMinigameFail(); } },
    myGen
  );
}

/* --- Jeu 3 : calcul express --- */
function renderMathGame(){
  const myGen = renderGen;
  const rounds = 2;
  let current = 0;
  let done = false;

  function makeProblem(){
    const a = Math.floor(Math.random()*18)+2;
    const b = Math.floor(Math.random()*18)+2;
    const ops = ["+","-","×"];
    const op = ops[Math.floor(Math.random()*ops.length)];
    let result;
    if(op === "+") result = a+b;
    else if(op === "-") result = a-b;
    else result = a*b;
    const wrongs = new Set();
    while(wrongs.size < 3){
      const delta = Math.floor(Math.random()*9)-4;
      const w = result + (delta === 0 ? 5 : delta);
      if(w !== result) wrongs.add(w);
    }
    const choices = [result, ...wrongs];
    for(let i=choices.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [choices[i],choices[j]] = [choices[j],choices[i]];
    }
    return { text:`${a} ${op} ${b}`, result, choices };
  }

  let problem = makeProblem();

  function draw(){
    card.innerHTML = `
      ${current === 0 ? '<p class="mg-why">❌ Mauvaise réponse. Réussis ce petit défi pour retenter ta chance sur une nouvelle question.</p>' : ''}
      <div class="mg-head">
        <p class="mg-title">Calcul express</p>
        <span class="mg-timer" id="mg-timer">15s</span>
      </div>
      <p class="mg-instructions">Résous ${rounds} calculs avant la fin du temps imparti. Manche ${current+1} / ${rounds}.</p>
      <p class="mg-math-q">${problem.text} = ?</p>
      <div class="mg-math-choices">
        ${problem.choices.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join("")}
      </div>
    `;
    card.querySelectorAll(".mg-math-choices .choice").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(done || myGen !== renderGen) return;
        const v = parseInt(btn.dataset.v);
        if(v === problem.result){
          current++;
          if(current >= rounds){
            done = true;
            clearInterval(interval);
            onMinigameSuccess();
          } else {
            problem = makeProblem();
            draw();
          }
        } else {
          done = true;
          clearInterval(interval);
          onMinigameFail();
        }
      });
    });
  }
  draw();

  const interval = mgTimerLoop(15,
    (r)=>{ const t=document.getElementById("mg-timer"); if(t){ t.textContent=r+"s"; if(r<=5) t.classList.add("low"); } },
    ()=>{ if(!done){ done = true; onMinigameFail(); } },
    myGen
  );
}

async function init(){
  buildStarfield();
  buildCategoryPools();
  progress = await loadProgress();
  themeSeen = await loadThemeSeen();
  if(progress.lastDate && progress.lastDate !== todayKey() && progress.lastDate !== yesterdayKey()){
    progress.streak = 0;
  }
  updateStreakBadge();
  document.querySelectorAll(".nav-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>switchTab(btn.dataset.tab));
  });
  minigamesEnabled = await loadMinigameSetting();
  updateMinigameToggleUI();
  document.getElementById("minigameToggle").addEventListener("click", toggleMinigames);
  switchTab("daily");
}
init();
</script>
</body>
